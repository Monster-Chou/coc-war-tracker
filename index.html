<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部落冲突 · 部落战统计工具</title>
<style>
  :root {
    --bg: #eef2f9;
    --bg2: #f7f9fd;
    --card: #ffffff;
    --card2: #e6ecf7;
    --line: #c9d5e8;
    --text: #1e2b45;
    --muted: #5d6d8c;
    --gold: #d99a06;
    --gold-dark: #b8860b;
    --blue: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --purple: #7c3aed;
    --star: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
      radial-gradient(1200px 500px at 20% -10%, #dbe7ff 0%, transparent 60%),
      radial-gradient(900px 400px at 90% -10%, #efe0ff 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100%;
  }
  .app { max-width: 1180px; margin: 0 auto; padding: 0 16px 80px; }
  header.top {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 4px 10px;
    background: linear-gradient(to bottom, rgba(238,242,249,.97) 80%, rgba(238,242,249,0));
    backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, #f7c948, #c97b1e);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; box-shadow: 0 3px 10px rgba(247,201,72,.25);
  }
  .brand h1 { font-size: 14px; letter-spacing: .5px; }
  .brand .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .clan-banner { text-align: center; padding: 16px 8px 2px; }
  .clan-banner .clan-name {
    display: inline-block; margin: 0; font-size: 34px; font-weight: 800;
    letter-spacing: 1px; color: var(--text); cursor: pointer;
    border-bottom: 3px dashed transparent; transition: border-color .15s;
  }
  .clan-banner .clan-name:hover { border-color: var(--gold); }
  .clan-banner .coc-icon { vertical-align: -8px; margin-right: 6px; }
  .clan-banner .clan-edit-tip { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .clan-banner .local-status { display: block; margin-top: 6px; min-height: 22px; }
  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    padding: 9px 16px; border-radius: 10px; cursor: pointer; font-size: 14px;
    transition: all .15s;
  }
  .tab:hover { color: var(--text); border-color: var(--blue); background: #f2f6fd; }
  .tab.active { background: linear-gradient(135deg, #f7c948, #e0a51f); color: #231a04; border-color: transparent; font-weight: 700; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  .empty {
    text-align: center; color: var(--muted); padding: 42px 16px; font-size: 14px; line-height: 1.9;
  }
  .empty .big { font-size: 40px; display: block; margin-bottom: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); background: var(--card2); color: var(--text);
    padding: 8px 14px; border-radius: 9px; cursor: pointer; font-size: 13.5px;
    transition: filter .12s, transform .05s;
    min-height: 36px;
  }
  .btn:hover { filter: brightness(.96); }
  .btn:active { transform: scale(.97); }
  .btn.gold { background: linear-gradient(135deg, #f7c948, #e0a51f); color: #231a04; font-weight: 700; border-color: transparent; }
  .btn.gold:hover { filter: brightness(1.05); }
  .btn.blue { background: #2563eb; border-color: transparent; color: #fff; }
  .btn.red { background: #dc2626; border-color: transparent; color: #fff; }
  .btn.green { background: #16a34a; border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; min-height: 30px; border-radius: 7px; }
  .btn.mini { padding: 2px 7px; font-size: 11px; min-height: 22px; border-radius: 6px; gap: 3px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.will-yes { background: rgba(22,163,74,.16); color: #15803d; border-color: rgba(22,163,74,.5); font-weight: 600; }
  .btn.will-no { background: rgba(220,38,38,.16); color: #b91c1c; border-color: rgba(220,38,38,.5); font-weight: 600; }
  .btn.no-show-on { background: rgba(220,38,38,.16); color: #b91c1c; border-color: rgba(220,38,38,.5); font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; }
  .right { margin-left: auto; }

  .inp, select.inp {
    background: #ffffff; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 13.5px; min-height: 36px;
    outline: none; width: 100%;
  }
  .inp:focus { border-color: var(--gold); }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; flex: 1; min-width: 150px; }
  .field label { font-size: 12.5px; color: var(--muted); }
  .form-grid { display: flex; gap: 12px; flex-wrap: wrap; }

  table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.tbl th, table.tbl td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.tbl th { color: var(--muted); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  table.tbl tr:hover td { background: rgba(37,99,235,.06); }
  table.tbl td.num, table.tbl th.num { text-align: center; }
  .tbl-scroll { overflow-x: auto; }

  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px;
    font-weight: 600; white-space: nowrap;
  }
  .badge.blue { background: rgba(37,99,235,.12); color: #1d4ed8; }
  .badge.purple { background: rgba(124,58,237,.12); color: #6d28d9; }
  .badge.gold { background: rgba(217,154,6,.15); color: #a16207; }
  .badge.green { background: rgba(22,163,74,.12); color: #15803d; }
  .badge.red { background: rgba(220,38,38,.12); color: #b91c1c; }
  .badge.gray { background: rgba(100,116,139,.14); color: #475569; }
  .th-badge { font-weight: 700; font-size: 11px; }

  .atk {
    display: flex; flex-direction: column; gap: 4px; min-width: 150px;
    padding: 6px 8px; border-radius: 10px; background: #f4f7fc; border: 1px solid var(--line);
  }
  .atk.done { border-color: #9db4d8; background: #eaf1fb; }
  .atk-ns {
    display: flex; align-items: center; justify-content: center; min-width: 150px; min-height: 64px;
    border-radius: 10px; border: 1px dashed #e2b3b3; background: #fdf1f1;
    color: #b91c1c; font-weight: 600; font-size: 13px;
  }
  .atk .stars { display: flex; gap: 3px; }
  .sb {
    flex: 1; border: 1px solid var(--line); background: #ffffff; color: var(--muted);
    border-radius: 6px; cursor: pointer; font-size: 11.5px; padding: 4px 0; min-height: 26px;
    letter-spacing: 0;
  }
  .sb:hover { filter: brightness(1.3); }
  .sb.sel { border-color: transparent; color: #10131a; font-weight: 700; }
  .sb.s0.sel { background: #ff6b6b; }
  .sb.s1.sel { background: #4da3ff; }
  .sb.s2.sel { background: #b07cff; }
  .sb.s3.sel { background: var(--star); }
  .atk .mini { display: flex; gap: 4px; }
  .atk input.inp { padding: 4px 6px; font-size: 12.5px; min-height: 28px; text-align: center; }
  .atk input.inp::-webkit-inner-spin-button { opacity: .4; }

  .sum-stars { font-weight: 700; color: var(--star); white-space: nowrap; font-size: 14px; }
  .member-cell .nm { font-weight: 600; }
  .member-cell .meta { font-size: 11.5px; color: var(--muted); }
  .plan-target { font-weight: 700; }
  .plan-hit { color: var(--green); }
  .plan-miss { color: var(--red); }
  .plan-none { color: var(--muted); }

  .progress-wrap { height: 8px; background: #dde5f2; border-radius: 999px; overflow: hidden; flex: 1; min-width: 120px; }
  .progress-in { height: 100%; background: linear-gradient(90deg, #f7c948, #e0a51f); border-radius: 999px; transition: width .25s; }
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat-card .v { font-size: 22px; font-weight: 800; color: var(--gold); }
  .stat-card .k { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px;
  }
  .chip.active { background: var(--gold); color: #231a04; border-color: transparent; font-weight: 700; }

  .war-item {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s;
  }
  .war-item:hover { border-color: var(--blue); }
  .war-item .t { font-weight: 700; font-size: 15px; }
  .war-item .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .league-group { border-left: 3px solid var(--purple); padding-left: 14px; margin: 18px 0 22px; }
  .league-group .lg-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .league-group .lg-name { font-weight: 800; font-size: 16px; }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(30,41,59,.45); z-index: 100;
    display: flex; align-items: flex-start; justify-content: center; padding: 7vh 14px 40px;
    overflow-y: auto;
  }
  .modal-mask[hidden] { display: none; }
  .modal {
    background: #ffffff; border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; width: 100%; max-width: 620px; box-shadow: 0 20px 50px rgba(30,41,59,.25);
  }
  .modal h3 { font-size: 17px; margin-bottom: 14px; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .check-list { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #f4f7fc; }
  .check-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .check-item:hover { background: var(--card2); }
  .check-item input { accent-color: #f7c948; width: 16px; height: 16px; cursor: pointer; }
  .check-item .meta { font-size: 11.5px; color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(80px);
    background: #ffffff; border: 1px solid #b9c9e2; color: var(--text);
    padding: 11px 22px; border-radius: 10px; font-size: 14px; z-index: 200;
    transition: transform .25s; box-shadow: 0 8px 30px rgba(30,41,59,.2); max-width: 90vw;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: #dc2626; background: #fdeaea; color: #b91c1c; }

  .plan-chip { display: inline-block; min-width: 34px; text-align: center; padding: 3px 8px; border-radius: 7px; background: #ffffff; border: 1px solid var(--line); font-size: 12.5px; font-weight: 700; }
  .plan-chip.over { border-color: var(--red); color: var(--red); }

  @media (max-width: 760px) {
    .brand h1 { font-size: 13px; }
    .tab { padding: 8px 11px; font-size: 13px; }
    .atk { min-width: 128px; }
    .stat-cards { grid-template-columns: repeat(2, 1fr); }
    .clan-banner .clan-name { font-size: 26px; }
  }
</style>
</head>

<script>
'use strict';
/* ================= 基础 ================= */
const LS_KEY = 'coc-war-tracker-v1';
const $ = s => document.querySelector(s);
const main = $('#main');
const mask = $('#modalMask');
const toastEl = $('#toast');

function loadDB() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.members) && Array.isArray(d.wars)) {
        d.leagues = Array.isArray(d.leagues) ? d.leagues : [];
        if (typeof d.clanName !== 'string') d.clanName = '';
        return d;
      }
    }
  } catch (e) { /* 数据损坏则重建 */ }
  return { members: [], wars: [], leagues: [] };
}
let db = loadDB();
let current = { page: 'members', warId: null, leagueTab: 'record', statFilter: 'all', sortKey: 'stars', sortDir: -1, memberSearch: '' };

/* ================= 云同步（Supabase） ================= */
const SYNC_CFG_KEY = 'coc-war-tracker-sync-cfg';
function loadSyncCfg() {
  try {
    const c = JSON.parse(localStorage.getItem(SYNC_CFG_KEY));
    if (c && c.url && c.key) return c;
  } catch (e) {}
  return null;
}
let syncCfg = loadSyncCfg();
let syncState = { status: 'unset', lastAt: null, error: '' };
let syncTimer = null;
let pendingImport = null;
const APP_VERSION = 'v2.6';
function syncId() { return (syncCfg && syncCfg.id) || 'main'; }
function supHeaders() {
  const h = {
    'apikey': syncCfg.key,
    'Content-Type': 'application/json',
    'Accept': 'application/json'
  };
  const k = String(syncCfg.key || '');
  // 新版 Publishable key（sb_publishable_ / pk_ 开头）只走 apikey header，不能作为 Bearer 发送；
  // 旧版 anon key（eyJ 开头 JWT）需要 Authorization: Bearer
  if (!/^(sb_publishable_|pk_)/.test(k)) {
    h['Authorization'] = 'Bearer ' + k;
  }
  return h;
}
async function pushToCloud() {
  db.updatedAt = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) {}
  const url = syncCfg.url.replace(/\/+$/, '') + '/rest/v1/clan_sync?on_conflict=id';
  const res = await fetch(url, {
    method: 'POST',
    headers: Object.assign(supHeaders(), { 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify({ id: syncId(), data: db, updated_at: db.updatedAt })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
}
async function fetchCloudRow() {
  const url = syncCfg.url.replace(/\/+$/, '') + '/rest/v1/clan_sync?id=eq.' + encodeURIComponent(syncId()) + '&select=data,updated_at';
  const res = await fetch(url, { headers: supHeaders() });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const rows = await res.json();
  return rows && rows[0];
}
function setSyncState(status, lastAt, error) {
  syncState = { status, lastAt, error };
  if (current.page === 'backup') renderBackup();
}
function scheduleUpload() {
  if (!syncCfg) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    pushToCloud().then(() => setSyncState('ok', new Date())).catch(e => setSyncState('fail', null, friendlySyncError(e)));
  }, 1500);
}
function friendlySyncError(e) {
  const msg = String(e && e.message || e);
  if (msg === 'Failed to fetch') {
    return '网络请求失败：请确认项目地址是 https://xxxx.supabase.co 格式（Settings → API 里复制 Project URL），且当前网络能访问 supabase.co';
  }
  return msg;
}
async function cloudSync(force) {
  if (!syncCfg) { toast('请先配置云同步', true); return; }
  setSyncState('busy');
  try {
    const cloud = await fetchCloudRow();
    const localAt = db.updatedAt || '1970-01-01T00:00:00.000Z';
    if (cloud && force !== 'up') {
      if (force === 'down' || cloud.updated_at > localAt) {
        const cd = cloud.data;
        if (cd && Array.isArray(cd.members) && Array.isArray(cd.wars)) {
          cd.leagues = Array.isArray(cd.leagues) ? cd.leagues : [];
          if (typeof cd.clanName !== 'string') cd.clanName = '';
          db = cd;
          try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) {}
          render();
          setSyncState('ok', new Date());
          toast('已从云端同步最新数据');
          return;
        }
      }
    }
    if (force === 'down') { toast('云端没有有效数据', true); setSyncState('fail', null, '云端无有效数据'); return; }
    await pushToCloud();
    setSyncState('ok', new Date());
    if (force === 'up') toast('已上传本地数据到云端');
    else if (!cloud) toast('已建立云端备份');
  } catch (e) {
    setSyncState('fail', null, friendlySyncError(e));
    toast('同步失败：' + friendlySyncError(e), true);
  }
}
function initCloudSync() {
  if (syncCfg) cloudSync();
}
/* 自动导入：同步脚本把数据注入 HTML 的 apiData 槽位后，启动时合并进本地数据 */
function mergeApiData(data) {
  const byTag = {};
  db.members.forEach(m => { if (m.tag) byTag[m.tag] = m; });
  let added = 0;
  (data.members || []).forEach(nm => {
    if (!nm || !nm.tag) return;
    if (byTag[nm.tag]) {
      const old = byTag[nm.tag];
      old.name = nm.name;
      old.th = nm.th;
      old.role = nm.role;
      if (nm.warPreference === 'in') old.willWar = true;
      else if (nm.warPreference === 'out') old.willWar = false;
    } else {
      db.members.push({
        id: nm.tag, name: nm.name, tag: nm.tag, th: nm.th, role: nm.role,
        active: true, willWar: nm.warPreference === 'out' ? false : true, joinedAt: new Date().toISOString()
      });
      added++;
    }
  });
  (data.wars || []).forEach(nw => {
    if (!nw || !nw.id) return;
    const ex = db.wars.find(w => w.id === nw.id);
    if (ex) {
      ex.participants = nw.participants || ex.participants;
      ex.records = nw.records || ex.records;
      if (nw.result && nw.result !== 'pending') ex.result = nw.result;
      ex.name = nw.name || ex.name;
      ex.opponent = nw.opponent || ex.opponent;
    } else {
      db.wars.push(nw);
    }
  });
  if (!db.clanName && data.clanName) db.clanName = data.clanName;
  return added;
}
/* 合并导入：备份文件数据补充进来，保留本地手动数据（意愿/离队/规划） */
function mergeImportData(d) {
  const byTag = {};
  db.members.forEach(m => { if (m.tag) byTag[m.tag] = m; });
  (d.members || []).forEach(nm => {
    if (!nm || !nm.tag) return;
    if (byTag[nm.tag]) {
      const old = byTag[nm.tag];
      old.name = nm.name;
      old.th = nm.th;
      old.role = nm.role;
      if (nm.warPreference === 'in') old.willWar = true;
      else if (nm.warPreference === 'out') old.willWar = false;
    } else {
      db.members.push(Object.assign({}, nm, { id: nm.tag }));
    }
  });
  const warIds = {};
  db.wars.forEach(w => { warIds[w.id] = w; });
  (d.wars || []).forEach(nw => {
    if (!nw || !nw.id) return;
    const ex = warIds[nw.id];
    if (ex) {
      ex.participants = nw.participants || ex.participants;
      ex.records = nw.records || ex.records;
      if (nw.result && nw.result !== 'pending') ex.result = nw.result;
      ex.name = nw.name || ex.name;
      ex.opponent = nw.opponent || ex.opponent;
    } else {
      db.wars.push(nw);
    }
  });
  const lgIds = {};
  db.leagues.forEach(l => { lgIds[l.id] = l; });
  (d.leagues || []).forEach(nl => {
    if (!nl || !nl.id) return;
    if (!lgIds[nl.id]) db.leagues.push(nl);
  });
  if (!db.clanName && d.clanName) db.clanName = d.clanName;
}
function autoImportApiData() {
  try {
    const el = document.getElementById('apiData');
    if (!el) return;
    const raw = (el.textContent || '').trim();
    if (!raw || raw === '{}') return;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.members)) return;
    const stamp = data.updatedAt || '';
    const lastKey = LS_KEY + '-last-api-import';
    try {
      if (stamp && localStorage.getItem(lastKey) === stamp) return; // 已导入过这批数据
    } catch (e2) {}
    mergeApiData(data);
    if (stamp) {
      try { localStorage.setItem(lastKey, stamp); } catch (e3) {}
    }
    save();
    toast('✅ 已自动导入最新部落数据（同步脚本）');
  } catch (e) { /* 静默忽略 */ }
}

/* ================= 本地同步（便携版 · 通过本地服务调 COC API） ================= */
const LOCAL_CFG_KEY = 'coc-local-sync-cfg';
let localCfg = (function () {
  try { return JSON.parse(localStorage.getItem(LOCAL_CFG_KEY)) || null; } catch (e) { return null; }
})();
let localEditing = false;
let localSyncState = { status: 'unset', lastAt: null, error: '' };
let localServiceOnline = null;
function saveLocalCfg() {
  try { localStorage.setItem(LOCAL_CFG_KEY, JSON.stringify(localCfg || {})); } catch (e) {}
}
function localApiBase() {
  return location.protocol === 'http:' ? '' : 'http://127.0.0.1:8971';
}
function setLocalSyncState(status, lastAt, error) {
  localSyncState = { status: status, lastAt: lastAt, error: error };
  if (current.page === 'backup') renderBackup();
}
function localSyncNow() {
  if (!localCfg || !localCfg.apiKey || !localCfg.clanTag) { toast('请先填写 API Key 和部落标签', true); return; }
  setLocalSyncState('busy');
  const tag = String(localCfg.clanTag).replace(/^#/, '');
  return fetch(localApiBase() + '/api/sync?tag=' + encodeURIComponent(tag) + '&prefs=1', {
    headers: { 'x-coc-key': localCfg.apiKey }
  }).then(function (r) {
    return r.json().then(function (d) { return { ok: r.ok, d: d }; });
  }).then(function (res) {
    var d = res.d;
    if (!res.ok) throw new Error((d && d.error) || '同步失败');
    var added = mergeApiData(d);
    save();
    setLocalSyncState('ok', new Date());
    var warInfo = d.wars && d.wars.length ? '，含当前战争' : '';
    toast('✅ 同步完成：' + d.members.length + ' 名成员' + warInfo + (added ? '（新增 ' + added + ' 名）' : ''));
  }).catch(function (e) {
    var msg = String((e && e.message) || e);
    setLocalSyncState('fail', null, msg);
    toast('同步失败：' + msg, true);
  });
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function starsText(n) { return '★'.repeat(n) || '0'; }
function memberMap() {

function clamp(v, min, max) {
  v = parseInt(v, 10);
  if (isNaN(v)) return null;
  return Math.min(max, Math.max(min, v));
}
function cleanTag(v) {
  if (v == null) return '';
  const body = String(v).trim().toUpperCase().replace(/[^#A-Z0-9]/g, '').replace(/#/g, '').slice(0, 9);
  return body ? '#' + body : '';
}
function fallbackCopy(text, done, fail) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) done(); else fail();
  } catch (e) { fail(); }
}
function copyText(text) {
  text = String(text == null ? '' : text);
  if (!text) { toast('没有可复制的内容', true); return; }
  const done = () => toast('已复制：' + text);
  const fail = () => toast('复制失败，请手动复制', true);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done, fail));
  } else {
    fallbackCopy(text, done, fail);
  }
}
function toast(msg, isErr) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function renderWars() {
  const normalWars = db.wars.filter(w => w.type === 'normal').sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const leagueWars = db.wars.filter(w => w.type === 'league');
  const leagueGroups = db.leagues.map(lg => ({
    lg,
    wars: leagueWars.filter(w => w.leagueId === lg.id).sort((a, b) => (a.battleNo || 0) - (b.battleNo || 0))
  }));

  const warCard = w => {
    const noShowCount = w.participants.filter(mid => w.noShows && w.noShows[mid]).length;
    const due = (w.participants.length - noShowCount) * 2;
    const rec = w.records || {};
    let used = 0, stars = 0;
    w.participants.forEach(mid => {
      if (w.noShows && w.noShows[mid]) return;
      const arr = rec[mid] || [null, null];
      arr.forEach(a => { if (a) { used++; stars += a.stars || 0; } });
    });
    const pct = due ? Math.round(used / due * 100) : 0;
    const resultBadge = { win: '<span class="badge green">🏆 胜利</span>', loss: '<span class="badge red">💀 失败</span>', draw: '<span class="badge gray">🤝 平局</span>' }[w.result] || '<span class="badge gray">进行中</span>';
    const typeBadge = w.type === 'league' ? '<span class="badge purple">联赛</span>' : '<span class="badge blue">普通战</span>';
    return '<div class="war-item" data-action="open-war" data-id="' + w.id + '">' +
      '<div style="min-width:180px;flex:1"><div class="t">' +
      (w.type === 'league' ? '第 ' + w.battleNo + ' 场 · ' : '') + esc(w.name) + '</div>' +
      '<div class="s">' + (w.opponent ? '对手：' + esc(w.opponent) + ' · ' : '') + (w.date || '无日期') + ' · ' + w.participants.length + 'v' + w.participants.length + '</div></div>' +
      '<div class="row" style="flex:1;min-width:190px">' +
        '<div class="progress-wrap"><div class="progress-in" style="width:' + pct + '%"></div></div>' +
        '<span class="badge gray">' + used + '/' + due + '</span>' +
      '</div>' +
      '<span class="badge gold">⭐ ' + stars + '</span>' +
      (noShowCount ? '<span class="badge red">🚫 缺勤 ' + noShowCount + '</span>' : '') +
      typeBadge + resultBadge +
      '<button class="btn sm ghost" data-action="del-war" data-id="' + w.id + '">🗑</button>' +
      '</div>';
  };

  const leagueBlock = lg => {
    let allDue = 0, absent = 0;
    lg.wars.forEach(w => {
      const ns = w.participants.filter(mid => w.noShows && w.noShows[mid]).length;
      absent += ns;
      allDue += (w.participants.length - ns) * 2;
    });
    let used = 0, stars = 0;
    lg.wars.forEach(w => {
      const rec = w.records || {};
      w.participants.forEach(mid => {
        if (w.noShows && w.noShows[mid]) return;
        (rec[mid] || [null, null]).forEach(a => { if (a) { used++; stars += a.stars || 0; } });
      });
    });
    return '<div class="league-group">' +
      '<div class="lg-head"><span class="lg-name">🏆 ' + esc(lg.lg.name) + '</span>' +
      '<span class="badge purple">' + lg.wars.length + ' 场</span>' +
      '<span class="badge gray">已进攻 ' + used + '/' + allDue + '</span>' +
      (absent ? '<span class="badge red">🚫 缺勤 ' + absent + '</span>' : '') +
      '<span class="badge gold">⭐ ' + stars + '</span>' +
      '<button class="btn sm ghost" data-action="del-league" data-id="' + lg.lg.id + '">🗑 删除联赛</button></div>' +
      (lg.wars.length ? lg.wars.map(warCard).join('') : '<div class="empty">暂无场次</div>') +
      '</div>';
  };

  main.innerHTML =
    '<div class="card"><h2>⚔️ 部落战</h2>' +
    '<div class="row">' +
      '<button class="btn gold" data-action="new-normal">➕ 新建普通部落战</button>' +
      '<button class="btn blue" data-action="new-league">🏆 新建联赛</button>' +
    '</div></div>' +
    (normalWars.length === 0 && db.leagues.length === 0
      ? '<div class="card"><div class="empty"><span class="big">🛡️</span>还没有部落战记录。<br>点击上方按钮创建：<br><b>普通部落战</b>：直接记录每人 2 次进攻的星数、摧毁率、目标。<br><b>联赛</b>：先规划每人打谁，再记录实际结果并对比。</div></div>'
      : '') +
    leagueGroups.map(leagueBlock).join('') +
    (normalWars.length
      ? '<div class="league-group" style="border-left-color:#4da3ff"><div class="lg-head"><span class="lg-name">⚔️ 普通部落战</span><span class="badge blue">' + normalWars.length + ' 场</span></div>' +
        normalWars.map(warCard).join('') + '</div>'
      : '');
}

      if (a) {
        used++; stars += a.stars || 0;
        if (a.dest != null) { destSum += a.dest; destCnt++; }
        if (a.stars === 3) three++;
      }
    });
  });
  const pct = due ? Math.round(used / due * 100) : 0;
  const avgDest = destCnt ? (destSum / destCnt).toFixed(1) : '-';

  const plans = w.plans || {};
  const planCounts = {};
  for (let i = 1; i <= 15; i++) planCounts[i] = 0;
  w.participants.forEach(mid => { const p = plans[mid]; if (p) planCounts[p] = (planCounts[p] || 0) + 1; });

  const resultBtn = (key, label) =>
    '<button class="btn sm ' + (w.result === key ? 'gold' : 'ghost') + '" data-action="set-result" data-id="' + w.id + '" data-r="' + key + '">' + label + '</button>';

  const recordRows = w.participants.map(mid => {
    const m = mm[mid];
    const arr = rec[mid] || [null, null];
    const rowStars = (arr[0] ? (arr[0].stars || 0) : 0) + (arr[1] ? (arr[1].stars || 0) : 0);
    const ns = !!(w.noShows && w.noShows[mid]);
    return '<tr' + (ns ? ' style="opacity:.55"' : '') + '>' +
      '<td><div class="member-cell"><div class="nm">' + esc(m ? m.name : memberName(mid)) + '</div>' +
      '<div class="meta">' + (m ? (m.th ? m.th + ' 本 · ' : '') + esc(m.role || '成员') : '') + '</div>' +
      '<button class="btn sm ' + (ns ? 'no-show-on' : 'ghost') + '" data-action="toggle-noshow" data-mid="' + mid + '" style="margin-top:4px">' +
      (ns ? '🚫 未进攻' : '标记未进攻') + '</button></div></td>' +
      '<td>' + (ns ? '<div class="atk-ns">未进攻</div>' : atkCell(w, mid, 0)) + '</td>' +
      '<td>' + (ns ? '<div class="atk-ns">未进攻</div>' : atkCell(w, mid, 1)) + '</td>' +
      '<td class="num"><span class="sum-stars">' + (ns ? '缺勤' : (arr[0] || arr[1] ? starsText(rowStars) : '-')) + '</span></td>' +
      (w.type === 'league' ? '<td class="num">' + planBadge(plans[mid], arr) + '</td>' : '') +
      '</tr>';
  }).join('');

  function planBadge(p, arr) {
    if (p == null) return '<span class="plan-none">未规划</span>';
    const actual = [arr[0], arr[1]].filter(a => a).map(a => a.target);
    const hit = actual.includes(p);
    return '<span class="plan-target">#' + p + '</span>' +
      (actual.length ? (hit ? ' <span class="plan-hit">✓ 完成</span>' : ' <span class="plan-miss">✗ 实际 ' + actual.map(t => '#' + t).join('、') + '</span>') : ' <span class="plan-none">待进攻</span>');
  }

  const planRows = w.participants.map(mid => {
    const m = mm[mid];
    const p = plans[mid];
    const ns = !!(w.noShows && w.noShows[mid]);
    return '<tr' + (ns ? ' style="opacity:.55"' : '') + '>' +
      '<td><div class="member-cell"><div class="nm">' + esc(m ? m.name : memberName(mid)) + '</div>' +
      '<div class="meta">' + (m ? (m.th ? m.th + ' 本 · ' : '') + esc(m.role || '成员') : '') + '</div>' +
      '<button class="btn sm ' + (ns ? 'no-show-on' : 'ghost') + '" data-action="toggle-noshow" data-mid="' + mid + '" style="margin-top:4px">' +
      (ns ? '🚫 未进攻' : '标记未进攻') + '</button></div></td>' +
      '<td><select class="inp" style="max-width:120px" data-action="set-plan" data-mid="' + mid + '">' +
        '<option value="">未指派</option>' +
        Array.from({ length: 15 }, (_, i) => '<option value="' + (i + 1) + '"' + (p === i + 1 ? ' selected' : '') + '>对手 #' + (i + 1) + '</option>').join('') +
      '</select></td>' +
      '<td class="num">' + planBadge(p, rec[mid] || [null, null]) + '</td>' +
      '</tr>';
  }).join('');

  const planOverview = Object.keys(planCounts).map(i =>
    '<span class="plan-chip' + (planCounts[i] > 1 ? ' over' : '') + '" title="对手 #' + i + ' 被 ' + planCounts[i] + ' 人瞄准">#' + i + ' ×' + planCounts[i] + '</span>'
  ).join(' ');

  const isLeague = w.type === 'league';
  const tabBtn = (k, label) =>
    '<button class="btn sm ' + (current.leagueTab === k ? 'gold' : 'ghost') + '" data-action="league-tab" data-t="' + k + '">' + label + '</button>';

  main.innerHTML =
    '<div class="card">' +
    '<div class="row">' +
      '<button class="btn ghost" data-action="back-wars">← 返回</button>' +
      '<div class="grow"><h2 style="margin:0">' + (isLeague ? '第 ' + w.battleNo + ' 场 · ' : '') + esc(w.name) + '</h2>' +
      '<div class="s" style="font-size:12px;color:var(--muted);margin-top:3px">' +
        (w.opponent ? '对手：' + esc(w.opponent) + ' · ' : '') + (w.date || '无日期') + ' · ' + w.participants.length + 'v' + w.participants.length +
        (lg ? ' · ' + esc(lg.name) : '') +
      '</div></div>' +
      '<div class="row">' + resultBtn('win', '🏆 胜') + resultBtn('loss', '💀 负') + resultBtn('draw', '🤝 平') + resultBtn('pending', '进行中') + '</div>' +
    '</div>' +
    '<div class="row" style="margin-top:14px">' +
      '<div class="progress-wrap"><div class="progress-in" style="width:' + pct + '%"></div></div>' +
      '<span class="badge gray">已进攻 ' + used + '/' + due + '</span>' +
      '<button class="btn sm blue" data-action="edit-war" data-id="' + w.id + '">✏️ 编辑信息</button>' +
      '<button class="btn sm" data-action="edit-participants" data-id="' + w.id + '">👥 名单</button>' +
      '<button class="btn sm" data-action="export-war" data-id="' + w.id + '">📋 导出本场</button>' +
      '<button class="btn sm red" data-action="del-war" data-id="' + w.id + '">🗑 删除</button>' +
    '</div></div>' +
    '<div class="stat-cards">' +
      '<div class="stat-card"><div class="v">' + used + '<span style="font-size:13px">/' + due + '</span></div><div class="k">已用进攻</div></div>' +
      '<div class="stat-card"><div class="v">' + noShowCount + '</div><div class="k">未进攻（缺勤）</div></div>' +
      '<div class="stat-card"><div class="v">' + stars + '</div><div class="k">总星数</div></div>' +
      '<div class="stat-card"><div class="v">' + (due ? (stars / (due * 3) * 100).toFixed(1) + '<span style="font-size:13px">%</span>' : '-') + '</div><div class="k">满星率（占应有）</div></div>' +
      '<div class="stat-card"><div class="v">' + avgDest + '<span style="font-size:13px">%</span></div><div class="k">平均摧毁率</div></div>' +
      '<div class="stat-card"><div class="v">' + three + '</div><div class="k">三星次数</div></div>' +
    '</div>' +
    (w.participants.length === 0
      ? '<div class="card"><div class="empty"><span class="big">🎯</span>本场还没有参战成员。<br>点击上方「👥 名单」选择参战成员。</div></div>'
      : (isLeague
        ? '<div class="card">' +
          '<div class="row" style="margin-bottom:12px">' + tabBtn('plan', '🗺 规划目标') + tabBtn('record', '⚔️ 记录结果') +
          '<span class="right" style="font-size:12px;color:var(--muted)">' + (current.leagueTab === 'plan' ? '先规划每人打几号，再切换「记录结果」填写实际数据' : '记录每位成员 2 次进攻的实际情况') + '</span></div>' +
          (current.leagueTab === 'plan'
            ? '<div class="row" style="margin-bottom:10px">' +
                '<button class="btn gold sm" data-action="auto-plan">🎲 自动分配（每人一个不同目标）</button>' +
                '<button class="btn ghost sm" data-action="clear-plan">清空规划</button>' +
              '</div>' +
              '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">目标覆盖情况：</div>' +
              '<div class="row" style="gap:5px;margin-bottom:14px">' + planOverview + '</div>' +
              '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>成员</th><th>计划目标</th><th class="num">完成情况</th></tr></thead><tbody>' + planRows + '</tbody></table></div>'
            : '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>成员</th><th>进攻 1</th><th>进攻 2</th><th class="num">合计</th><th class="num">计划目标</th></tr></thead><tbody>' + recordRows + '</tbody></table></div>' +
              '<div style="font-size:12px;color:var(--muted);margin-top:10px">⭐ 点击星数按钮记录该次进攻（0-3 星），摧毁率和目标编号可直接输入；再点一次已选星数可撤销该次进攻记录。</div>') +
          '</div>'
        : '<div class="card"><h2>⚔️ 进攻记录</h2>' +
          '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>成员</th><th>进攻 1</th><th>进攻 2</th><th class="num">合计</th></tr></thead><tbody>' + recordRows + '</tbody></table></div>' +
          '<div style="font-size:12px;color:var(--muted);margin-top:10px">⭐ 点击星数按钮记录该次进攻（0-3 星），摧毁率和目标编号可直接输入；再点一次已选星数可撤销该次进攻记录。</div></div>'));

  if (isLeague) {
    document.querySelectorAll('[data-action="league-tab"]').forEach(b => b.classList.toggle('gold', b.dataset.t === current.leagueTab));
  }
}

/* ================= 统计页 ================= */
function renderStats() {
  const filterMap = { all: '全部', normal: '普通战', league: '联赛' };
  const wars = db.wars.filter(w => current.statFilter === 'all' ? true : w.type === current.statFilter);
  const stats = db.members.map(m => {
    let played = 0, absent = 0, due = 0, attacks = 0, stars = 0, destSum = 0, three = 0;
    wars.forEach(w => {
      if (!w.participants.includes(m.id)) return;
      played++;
      if (w.noShows && w.noShows[m.id]) { absent++; return; }
      due += 2;
      const arr = (w.records && w.records[m.id]) || [null, null];
      arr.forEach(a => {
        if (a) {
          attacks++; stars += a.stars || 0;
          if (a.dest != null) destSum += a.dest;
          if (a.stars === 3) three++;
        }
      });
    });
    return {
      m, played, absent, due, attacks,
      rate: due ? attacks / due : 0,
      stars,
      avgPerWar: played ? stars / played : 0,
      avgDest: attacks ? destSum / attacks : null,
      three,
      threeRate: attacks ? three / attacks : 0
    };
  }).filter(s => s.played > 0 || s.m.active !== false);

  const sorter = () => {
    const k = current.sortKey, d = current.sortDir;
    return stats.slice().sort((a, b) => {
      let va, vb;
      switch (k) {
        case 'name': va = a.m.name; vb = b.m.name; break;
        case 'played': va = a.played; vb = b.played; break;
        case 'absent': va = a.absent; vb = b.absent; break;
        case 'rate': va = a.rate; vb = b.rate; break;
        case 'stars': va = a.stars; vb = b.stars; break;
        case 'avgPerWar': va = a.avgPerWar; vb = b.avgPerWar; break;
        case 'avgDest': va = a.avgDest == null ? -1 : a.avgDest; vb = b.avgDest == null ? -1 : b.avgDest; break;
        case 'threeRate': va = a.threeRate; vb = b.threeRate; break;
        default: va = 0; vb = 0;
      }
      if (typeof va === 'string') return d * va.localeCompare(vb, 'zh');
      return d * (va - vb);
    });
  };
  const list = sorter();
  const head = (key, label) =>
    '<th class="num" style="cursor:pointer;user-select:none" data-action="sort" data-k="' + key + '">' +
    label + (current.sortKey === key ? (current.sortDir === -1 ? ' ▼' : ' ▲') : '') + '</th>';

  const tot = {
    played: stats.reduce((s, x) => s + x.played, 0),
    absent: stats.reduce((s, x) => s + x.absent, 0),
    attacks: stats.reduce((s, x) => s + x.attacks, 0),
    due: stats.reduce((s, x) => s + x.due, 0),
    stars: stats.reduce((s, x) => s + x.stars, 0)
  };

  const rows = list.map(s => '<tr>' +
    '<td><div class="member-cell"><div class="nm">' + esc(s.m.name) + '</div>' +
    '<div class="meta">' + (s.m.th ? s.m.th + ' 本 · ' : '') + esc(s.m.role || '成员') + '</div></div></td>' +
    '<td class="num">' + s.played + '</td>' +
    '<td class="num"><b style="color:' + (s.absent > 0 ? '#b91c1c' : '#15803d') + '">' + s.absent + '</b><span style="color:var(--muted)"> / ' + s.played + '</span></td>' +
    '<td class="num"><span class="badge ' + (s.rate >= 1 ? 'green' : s.rate >= .75 ? 'gold' : 'red') + '">' + Math.round(s.rate * 100) + '%</span></td>' +
    '<td class="num" style="font-weight:700;color:var(--star)">' + s.stars + '</td>' +
    '<td class="num">' + (s.played ? s.avgPerWar.toFixed(2) : '-') + '</td>' +
    '<td class="num">' + (s.avgDest != null ? s.avgDest.toFixed(1) + '%' : '-') + '</td>' +
    '<td class="num">' + s.three + '</td>' +
    '<td class="num">' + (s.attacks ? Math.round(s.threeRate * 100) + '%' : '-') + '</td>' +
    '</tr>').join('');

  main.innerHTML =
    '<div class="card"><h2>📊 成员统计 <span class="hint">点击表头可排序</span></h2>' +
    '<div class="chips">' + Object.keys(filterMap).map(k =>
      '<button class="chip' + (current.statFilter === k ? ' active' : '') + '" data-action="stat-filter" data-f="' + k + '">' + filterMap[k] + '</button>').join('') +
    '</div>' +
    '<div class="stat-cards">' +
      '<div class="stat-card"><div class="v">' + tot.played + '</div><div class="k">总上场人次</div></div>' +
      '<div class="stat-card"><div class="v">' + tot.absent + '<span style="font-size:13px"> / ' + tot.played + '</span></div><div class="k">缺勤 / 上场</div></div>' +
      '<div class="stat-card"><div class="v">' + (tot.played ? Math.round((tot.played - tot.absent) / tot.played * 100) : 0) + '<span style="font-size:13px">%</span></div><div class="k">整体出勤率</div></div>' +
      '<div class="stat-card"><div class="v">' + tot.stars + '</div><div class="k">总星数</div></div>' +
    '</div>' +
    (list.length === 0
      ? '<div class="empty">当前筛选下没有数据。</div>'
      : '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
        head('name', '成员') + head('played', '出战') + head('absent', '缺勤/上场') + head('rate', '使用率') +
        head('stars', '总星') + head('avgPerWar', '场均星') + head('avgDest', '均摧毁') + head('three', '三星数') + head('threeRate', '三星率') +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>') +
    '</div>' +
    '<div class="card"><h2>📈 每场战争汇总</h2>' +
    (wars.length === 0
      ? '<div class="empty">暂无战争数据。</div>'
      : '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>战争</th><th class="num">规模</th><th class="num">缺勤 · 已攻/应攻</th><th class="num">总星</th><th class="num">均摧毁</th><th class="num">三星</th></tr></thead><tbody>' +
      wars.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(w => {
        const noShowCnt = w.participants.filter(mid => w.noShows && w.noShows[mid]).length;
        const due = (w.participants.length - noShowCnt) * 2;
        const rec = w.records || {};
        let used = 0, stars = 0, dSum = 0, dCnt = 0, three = 0;
        w.participants.forEach(mid => {
          if (w.noShows && w.noShows[mid]) return;
          (rec[mid] || [null, null]).forEach(a => {
            if (a) { used++; stars += a.stars || 0; if (a.dest != null) { dSum += a.dest; dCnt++; } if (a.stars === 3) three++; }
          });
        });
        return '<tr>' +
          '<td><b>' + (w.type === 'league' ? '第 ' + w.battleNo + ' 场 · ' : '') + esc(w.name) + '</b>' +
          '<div style="font-size:11.5px;color:var(--muted)">' + (w.date || '') + '</div></td>' +
          '<td class="num">' + w.participants.length + 'v' + w.participants.length + '</td>' +
          '<td class="num">' + (noShowCnt > 0 ? '<b style="color:#b91c1c">缺 ' + noShowCnt + '</b> · ' : '') + used + '/' + due + '</td>' +
          '<td class="num" style="font-weight:700;color:var(--star)">' + stars + '</td>' +
          '<td class="num">' + (dCnt ? (dSum / dCnt).toFixed(1) + '%' : '-') + '</td>' +
          '<td class="num">' + three + '</td></tr>';
      }).join('') + '</tbody></table></div>') +
    '</div>';
}

/* ================= CSV 导出 ================= */
function download(name, content, mime) {
  const blob = new Blob(['\uFEFF' + content], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function csvCell(v) {
  v = String(v == null ? '' : v);
  if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function exportStatsCSV() {
  const stats = db.members.map(m => {
    let played = 0, absent = 0, due = 0, attacks = 0, stars = 0, destSum = 0, three = 0;
    db.wars.forEach(w => {
      if (!w.participants.includes(m.id)) return;
      played++;
      if (w.noShows && w.noShows[m.id]) { absent++; return; }
      due += 2;
      ((w.records && w.records[m.id]) || [null, null]).forEach(a => {
        if (a) { attacks++; stars += a.stars || 0; if (a.dest != null) destSum += a.dest; if (a.stars === 3) three++; }
      });
    });
    return [m.name, m.tag || '', m.th || '', m.role || '', m.active === false ? '已离队' : '活跃', played, absent, attacks, due,
      due ? Math.round(attacks / due * 100) + '%' : '-', stars, played ? (stars / played).toFixed(2) : '-',
      attacks ? (destSum / attacks).toFixed(1) + '%' : '-', three, attacks ? Math.round(three / attacks * 100) + '%' : '-'];
  });
  const lines = [['成员', '标签', '大本营', '职位', '状态', '上场次数', '缺勤次数', '已进攻', '应进攻', '使用率', '总星数', '场均星', '平均摧毁率', '三星数', '三星率']]
    .concat(stats).map(r => r.map(csvCell).join(','));
  download('部落战统计_成员汇总.csv', lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast('已导出成员统计 CSV');
}
function exportDetailCSV() {
  const mm = memberMap();
  const rows = [['战争名称', '类型', '场次', '日期', '成员', '进攻序号', '星数', '摧毁率%', '目标编号', '计划目标']];
  db.wars.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).forEach(w => {
    w.participants.forEach(mid => {
      const arr = (w.records && w.records[mid]) || [null, null];
      arr.forEach((a, i) => {
        if (a) rows.push([w.name, w.type === 'league' ? '联赛' : '普通战', w.battleNo || '', w.date || '', mm[mid] ? mm[mid].name : '(已删除成员)',
          i + 1, a.stars || 0, a.dest != null ? a.dest : '', a.target != null ? a.target : '', (w.plans && w.plans[mid]) || '']);
      });
    });
  });
  download('部落战统计_进攻明细.csv', rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('已导出进攻明细 CSV');
}
function exportWarText(w) {
  const mm = memberMap();
  const lines = [];
  lines.push('=== ' + (w.type === 'league' ? '联赛 第' + w.battleNo + '场 · ' : '') + w.name + ' ===');
  lines.push('日期: ' + (w.date || '') + (w.opponent ? '  对手: ' + w.opponent : ''));
  lines.push('');
  let used = 0, stars = 0;
  w.participants.forEach(mid => {
    const arr = (w.records && w.records[mid]) || [null, null];
    const parts = arr.map((a, i) => a ? '进攻' + (i + 1) + ': ' + (a.stars || 0) + '星' + (a.dest != null ? ' ' + a.dest + '%' : '') + (a.target != null ? ' 目标#' + a.target : '') : '进攻' + (i + 1) + ': 未用').join(' | ');
    arr.forEach(a => { if (a) { used++; stars += a.stars || 0; } });
    lines.push((mm[mid] ? mm[mid].name : '(已删除成员)') + '  →  ' + parts);
  });
  lines.push('');
  lines.push('已用进攻: ' + used + '/' + (w.participants.length * 2) + '  总星数: ' + stars);
  download('部落战_' + (w.name || w.id).replace(/[\\/:*?"<>|]/g, '_') + '.txt', lines.join('\r\n'));
  toast('已导出本场战报');
}

/* ================= 事件处理 ================= */
document.addEventListener('click', e => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) { go(navBtn.dataset.nav); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action;
  const id = el.dataset.id;

  switch (act) {
    case 'add-member': {
      const name = $('#mName').value.trim();
      if (!name) { toast('请填写成员昵称', true); return; }
      const th = parseInt($('#mTh').value, 10);
      db.members.push({
        id: uid(), name, tag: cleanTag($('#mTag').value), th,
        role: $('#mRole').value, willWar: $('#mWill').value !== '0', active: true, joinedAt: new Date().toISOString()
      });
      save(); render(); toast('已添加成员「' + name + '」');
      break;
    }
    case 'edit-member': openMemberEdit(id); break;
    case 'toggle-member': {
      const m = db.members.find(x => x.id === id);
      if (m) { m.active = m.active === false; save(); render(); toast(m.active ? '「' + m.name + '」已回归部落' : '「' + m.name + '」已标记离队'); }
      break;
    }
    case 'toggle-will': {
      const m = db.members.find(x => x.id === id);
      if (m) {
        m.willWar = m.willWar === false;
        save(); render();
        toast('「' + m.name + '」' + (m.willWar === false ? '🚫 不愿出战' : '✅ 愿意出战'));
      }
      break;
    }
    case 'copy-member': {
      const m = db.members.find(x => x.id === id);
      if (m) copyText(m.name + (m.tag ? ' ' + m.tag : ''));
      break;
    }
    case 'del-member': {
      const m = db.members.find(x => x.id === id);
      if (!m) break;
      if (!confirm('确定删除成员「' + m.name + '」？\n其历史战争记录将显示为「已删除成员」但仍保留。')) return;
      db.members = db.members.filter(x => x.id !== id);
      save(); render(); toast('已删除成员');
      break;
    }
    case 'save-member': {
      const name = $('#mmName').value.trim();
      if (!name) { toast('请填写成员昵称', true); return; }
      if (id) {
        const m = db.members.find(x => x.id === id);
        if (m) {
          m.name = name; m.tag = cleanTag($('#mmTag').value);
          m.th = parseInt($('#mmTh').value, 10); m.role = $('#mmRole').value;
          m.willWar = $('#mmWill').value !== '0';
        }
      } else {
        db.members.push({
          id: uid(), name, tag: cleanTag($('#mmTag').value), th: parseInt($('#mmTh').value, 10),
          role: $('#mmRole').value, willWar: $('#mmWill').value !== '0', active: true, joinedAt: new Date().toISOString()
        });
      }
      save(); closeModal(); render(); toast('已保存');
      break;
    }
    case 'new-normal': newNormalModal(); break;
    case 'new-league': newLeagueModal(); break;
    case 'check-all': {
      document.querySelectorAll('.check-list input[type=checkbox]').forEach(c => c.checked = true);
      updateCheckCount();
      break;
    }
    case 'check-none': {
      document.querySelectorAll('.check-list input[type=checkbox]').forEach(c => c.checked = false);
      updateCheckCount();
      break;
    }
    case 'check-willing': {
      const mm = memberMap();
      document.querySelectorAll('.check-list input[type=checkbox]').forEach(c => {
        const m = mm[c.value];
        c.checked = m && m.willWar !== false;
      });
      updateCheckCount();
      break;
    }
    case 'save-normal-war': {
      const pids = [...document.querySelectorAll('.check-list input:checked')].map(c => c.value);
      if (pids.length === 0) { toast('请至少勾选 1 名参战成员', true); return; }
      const w = {
        id: uid(), type: 'normal', name: $('#nwName').value.trim() || '普通部落战',
        opponent: $('#nwOpp').value.trim(), date: $('#nwDate').value || today(),
        participants: pids, records: {}, plans: {}, noShows: {}, result: 'pending'
      };
      db.wars.push(w);
      save(); closeModal(); go('war', w.id); toast('已创建，开始记录进攻吧');
      break;
    }
    case 'save-league': {
      const pids = [...document.querySelectorAll('.check-list input:checked')].map(c => c.value);
      if (pids.length === 0) { toast('请勾选初始参战名单', true); return; }
      if (pids.length > 15) { toast('联赛每场最多 15 人，当前选了 ' + pids.length + ' 人', true); return; }
      const count = parseInt($('#lgCount').value, 10);
      const lgId = uid();
      db.leagues.push({ id: lgId, name: $('#lgName').value.trim() || '联赛', date: $('#lgDate').value || today() });
      for (let i = 1; i <= count; i++) {
        db.wars.push({
          id: uid(), type: 'league', leagueId: lgId, battleNo: i,
          name: ($('#lgName').value.trim() || '联赛') + ' 第' + i + '场',
          opponent: '', date: $('#lgDate').value || today(), participants: pids.slice(), records: {}, plans: {}, noShows: {}, result: 'pending'
        });
      }
      save(); closeModal(); render(); toast('联赛已创建，共 ' + count + ' 场');
      break;
    }
    case 'open-war': go('war', id); break;
    case 'back-wars': go('wars'); break;
    case 'del-war': {
      const w = warById(id);
      if (!w) break;
      if (!confirm('确定删除「' + w.name + '」？其进攻记录将一并删除。')) return;
      db.wars = db.wars.filter(x => x.id !== id);
      save();
      if (current.page === 'war') go('wars'); else render();
      toast('已删除战争');
      break;
    }
    case 'del-league': {
      const lg = db.leagues.find(l => l.id === id);
      if (!lg) break;
      const cnt = db.wars.filter(w => w.leagueId === id).length;
      if (!confirm('确定删除联赛「' + lg.name + '」及其 ' + cnt + ' 场战斗的所有记录？')) return;
      db.wars = db.wars.filter(w => w.leagueId !== id);
      db.leagues = db.leagues.filter(l => l.id !== id);
      save(); render(); toast('已删除联赛');
      break;
    }
    case 'set-result': {
      const w = warById(id);
      if (w) { w.result = el.dataset.r; save(); render(); }
      break;
    }
    case 'edit-war': {
      const w = warById(id);
      if (w) editWarModal(w);
      break;
    }
    case 'save-war-edit': {
      const w = warById(id);
      if (w) {
        w.name = $('#ewName').value.trim() || w.name;
        w.opponent = $('#ewOpp').value.trim();
        w.date = $('#ewDate').value;
        save(); closeModal(); render();
      }
      break;
    }
    case 'edit-participants': {
      const w = warById(id);
      if (w) participantsModal(w);
      break;
    }
    case 'save-participants': {
      const w = warById(id);
      if (!w) break;
      const pids = [...document.querySelectorAll('.check-list input:checked')].map(c => c.value);
      const maxSel = w.type === 'league' ? 15 : 50;
      if (pids.length > maxSel) { toast('最多 ' + maxSel + ' 人，当前选了 ' + pids.length + ' 人', true); return; }
      w.participants = pids;
      save(); closeModal(); render(); toast('名单已更新');
      break;
    }
    case 'set-star': {
      const w = warById(current.warId);
      if (!w) break;
      const mid = el.dataset.mid, slot = parseInt(el.dataset.slot, 10), s = parseInt(el.dataset.s, 10);
      if (!w.records) w.records = {};
      if (!w.records[mid]) w.records[mid] = [null, null];
      const a = w.records[mid][slot];
      if (a && a.stars === s) w.records[mid][slot] = null;
      else w.records[mid][slot] = Object.assign({}, a || {}, { stars: s });
      save(); renderWarDetail();
      break;
    }
    case 'toggle-noshow': {
      const w = warById(current.warId);
      if (!w) break;
      const mid = el.dataset.mid;
      if (!w.noShows) w.noShows = {};
      if (w.noShows[mid]) delete w.noShows[mid];
      else w.noShows[mid] = true;
      save(); renderWarDetail();
      break;
    }
    case 'set-plan': break; /* select 用 change 事件处理 */
    case 'league-tab': current.leagueTab = el.dataset.t; renderWarDetail(); break;
    case 'auto-plan': {
      const w = warById(current.warId);
      if (!w) break;
      const targets = Array.from({ length: w.participants.length }, (_, i) => i + 1);
      for (let i = targets.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [targets[i], targets[j]] = [targets[j], targets[i]];
      }
      w.plans = {};
      w.participants.forEach((mid, i) => { w.plans[mid] = targets[i]; });
      save(); renderWarDetail(); toast('已自动分配目标');
      break;
    }
    case 'clear-plan': {
      const w = warById(current.warId);
      if (w) { w.plans = {}; save(); renderWarDetail(); toast('已清空规划'); }
      break;
    }
    case 'stat-filter': current.statFilter = el.dataset.f; render(); break;
    case 'sort': {
      const k = el.dataset.k;
      if (current.sortKey === k) current.sortDir *= -1;
      else { current.sortKey = k; current.sortDir = -1; }
      render();
      break;
    }
    case 'export-json': {
      download('部落战统计_备份_' + today() + '.json', JSON.stringify(db, null, 2), 'application/json');
      toast('已导出 JSON 备份');
      break;
    }
    case 'import-json': $('#importFile').click(); break;
    case 'export-csv-stats': exportStatsCSV(); break;
    case 'export-csv-detail': exportDetailCSV(); break;
    case 'export-snapshot': exportSnapshotHTML(); break;
    case 'import-merge': {
      if (!pendingImport) { closeModal(); break; }
      const d = pendingImport;
      pendingImport = null;
      d.leagues = Array.isArray(d.leagues) ? d.leagues : [];
      mergeImportData(d);
      save(); closeModal(); go('members');
      toast('✅ 合并导入成功，手动数据已保留');
      break;
    }
    case 'import-overwrite': {
      if (!pendingImport) { closeModal(); break; }
      const d = pendingImport;
      pendingImport = null;
      d.leagues = Array.isArray(d.leagues) ? d.leagues : [];
      if (typeof d.clanName !== 'string') d.clanName = '';
      db = d;
      save(); closeModal(); go('members');
      toast('已覆盖导入');
      break;
    }
    case 'save-sync-cfg': {
      const url = $('#syUrl').value.trim();
      const key = $('#syKey').value.trim();
      if (!/^https?:\/\//.test(url)) { toast('请填写正确的项目地址（以 http 开头）', true); return; }
      if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)) {
        toast('⚠️ 地址格式不对：应为你的项目地址，形如 https://xxxx.supabase.co（在 Settings → API 里复制 Project URL，不是 api.supabase.com）', true);
        return;
      }
      if (!key) { toast('请填写 anon 公钥', true); return; }
      syncCfg = { url, key, id: ($('#syId').value.trim() || 'main') };
      try { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg)); } catch (e) {}
      render();
      cloudSync();
      break;
    }
    case 'sync-now': cloudSync(); break;
    case 'sync-up': cloudSync('up'); break;
    case 'sync-down': {
      if (!confirm('从云端下载将覆盖本机的数据，确定继续？')) return;
      cloudSync('down');
      break;
    }
    case 'clear-sync': {
      if (!confirm('解除云同步配置？本机数据保留，只是不再自动同步。')) return;
      syncCfg = null;
      try { localStorage.removeItem(SYNC_CFG_KEY); } catch (e) {}
      syncState = { status: 'unset', lastAt: null, error: '' };
      render();
      toast('已解除云同步配置');
      break;
    }
    case 'save-local-cfg': {
      const k = $('#lswKey').value.trim();
      const t = $('#lswTag').value.trim();
      if (!k) { toast('请填写 COC API Key', true); return; }
      if (!t) { toast('请填写部落标签', true); return; }
      localCfg = { apiKey: k, clanTag: t };
      localEditing = false;
      saveLocalCfg();
      render();
      toast('本地同步配置已保存');
      break;
    }
    case 'local-sync': localSyncNow(); break;
    case 'edit-local-cfg': {
      localEditing = true;
      render();
      break;
    }
    case 'check-local': checkLocalService(); break;
    case 'export-war': {
      const w = warById(id);
      if (w) exportWarText(w);
      break;
    }
    case 'reset': {
      if (!confirm('确定清空所有数据？此操作不可恢复！\n建议先导出 JSON 备份。')) return;
      if (!confirm('再次确认：真的要删除全部成员、战争和联赛数据吗？')) return;
      db = { members: [], wars: [], leagues: [], clanName: '' };
      save(); go('members'); toast('已清空所有数据');
      break;
    }
    case 'edit-clan': {
      openModal(
        '<h3>🏰 设置部落名称</h3>' +
        '<div class="field"><label>部落名称（显示在页面顶部大标题）</label><input class="inp" id="cnName" value="' + esc(db.clanName || '') + '" placeholder="如：野蛮人之都" maxlength="30"></div>' +
        '<div class="foot">' +
          '<button class="btn ghost" data-action="close-modal">取消</button>' +
          '<button class="btn gold" data-action="save-clan">保存</button>' +
        '</div>');
      break;
    }
    case 'save-clan': {
      db.clanName = $('#cnName').value.trim();
      save(); closeModal(); render();
      toast('部落名称已更新');
      break;
    }
    case 'close-modal': closeModal(); break;
  }
});

/* input 事件：玩家标签实时过滤（# 开头、仅大写字母与数字、小写自动转大写）与成员搜索 */
document.addEventListener('input', e => {
  const el = e.target;
  if (!el) return;
  if (el.id === 'memberSearch') {
    current.memberSearch = el.value;
    renderMemberList();
    return;
  }
  if (el.id !== 'mTag' && el.id !== 'mmTag') return;
  let v = el.value.toUpperCase().replace(/[^#A-Z0-9]/g, '').replace(/#/g, '');
  v = '#' + v.slice(0, 9);
  if (el.value !== v) el.value = v;
});

/* change 事件：select 规划、数字输入、名单计数、导入文件 */
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('.check-list input[type=checkbox]')) { updateCheckCount(); return; }

  if (el.matches('select[data-action="set-plan"]')) {
    const w = warById(current.warId);
    if (!w) return;
    const mid = el.dataset.mid;
    if (!w.plans) w.plans = {};
    if (el.value === '') delete w.plans[mid];
    else w.plans[mid] = parseInt(el.value, 10);
    save(); renderWarDetail();
    return;
  }

  if (el.matches('.atk input.inp')) {
    const w = warById(current.warId);
    if (!w) return;
    const mid = el.dataset.mid, slot = parseInt(el.dataset.slot, 10);
    if (!w.records) w.records = {};
    if (!w.records[mid]) w.records[mid] = [null, null];
    const field = el.dataset.field;
    const maxTgt = w.type === 'league' ? 15 : 50;
    let val = el.value.trim();
    if (val === '') {
      if (w.records[mid][slot]) {
        if (field === 'dest') w.records[mid][slot].dest = null;
        else w.records[mid][slot].target = null;
        const a = w.records[mid][slot];
        if (a.stars == null && a.dest == null && a.target == null) w.records[mid][slot] = null;
      }
    } else {
      let n = parseInt(val, 10);
      if (isNaN(n)) { renderWarDetail(); return; }
      n = Math.min(field === 'dest' ? 100 : maxTgt, Math.max(field === 'dest' ? 0 : 1, n));
      el.value = n;
      if (!w.records[mid][slot]) w.records[mid][slot] = {};
      w.records[mid][slot][field] = n;
      if (w.records[mid][slot].stars == null) w.records[mid][slot].stars = 0;
    }
    save(); renderWarDetail();
    return;
  }

  if (el.id === 'importFile') {
    const file = el.files && el.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!d || !Array.isArray(d.members) || !Array.isArray(d.wars)) throw new Error('bad');
        pendingImport = d;
        openModal(
          '<h3>📥 选择导入方式</h3>' +
          '<p style="font-size:13.5px;color:var(--muted);line-height:1.9;margin-bottom:12px">' +
          '备份文件包含 <b>' + d.members.length + '</b> 名成员、<b>' + d.wars.length + '</b> 场战争。<br>' +
          '· <b style="color:var(--text)">合并导入</b>：把备份里的数据补充进来，你手动设置的<b>出战意愿、离队状态、战争规划</b>等不会被覆盖（推荐）。<br>' +
          '· <b style="color:var(--text)">覆盖导入</b>：用备份完全替换当前数据（用于恢复到某个旧备份）。</p>' +
          '<div class="foot">' +
            '<button class="btn ghost" data-action="close-modal">取消</button>' +
            '<button class="btn blue" data-action="import-merge">🔀 合并导入（推荐）</button>' +
            '<button class="btn gold" data-action="import-overwrite">📦 覆盖导入</button>' +
          '</div>');
      } catch (err) { toast('文件格式不正确，导入失败', true); }
    };
    reader.readAsText(file);
    el.value = '';
    return;
  }
});

function updateCheckCount() {
  const n = document.querySelectorAll('.check-list input:checked').length;
  const c = $('#nwCount') || $('#lgCountSel') || $('#pcCount');
  if (c) c.textContent = n;
}
function openMemberEdit(id) {
  const m = db.members.find(x => x.id === id);
  if (m) memberModal(m);
}

/* ================= 启动 ================= */
render();
autoImportApiData();
initCloudSync();
checkLocalService();
</script>
</body>
</html>
